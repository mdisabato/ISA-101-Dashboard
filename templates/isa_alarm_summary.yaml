# button-card template "isa_alarm_summary", exported from the dashboard's raw config.
isa_alarm_summary:
  show_name: false
  show_icon: false
  show_state: false
  styles:
    card:
      - padding: "0"
      - background: "#e8e8e8"
      - border: "1px solid #999999"
      - border-radius: "2px"
      - box-shadow: none
      - color: "#1a1a1a"
    grid:
      - grid-template-areas: "\"s\""
      - grid-template-columns: "1fr"
    custom_fields:
      s:
        - width: "100%"
        - text-align: left
        - white-space: normal
  custom_fields:
    s: "[[[ const COL = {0:'#808080',1:'#0088cc',2:'#cc8800',3:'#cc0000'}; const ICON = {0:'○',1:'◇',2:'▲',3:'◆'}; const st = id => states[id] ? states[id].state : undefined; const bad = s => s === undefined || ['unavailable','unknown',''].includes(s); const hm = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; }; const nowMin = (() => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); })(); const inWin = w => { const a = hm(w[0]), b = hm(w[1]); return a <= b ? (nowMin >= a && nowMin < b) : (nowMin >= a || nowMin < b); }; let LOADING = false; const evalItem = it => { const [id, want, label, lvl, note] = it; const o = it[5] || {}; if (id && LOADING && !states[id]) return {ok: true, label}; if (!id) return {ok: false, l: lvl === undefined ? 1 : lvl, t: `${label}: ${note || 'not instrumented'}`, label}; const s = st(id); let ok, t; if (bad(s)) { ok = false; t = want && want.resolves ? `${label}: lookup failing` : `${label}: no data`; } else { const unit = (states[id].attributes || {}).unit_of_measurement || ''; if (want && typeof want === 'object' && !Array.isArray(want)) { if (want.same_as !== undefined) ok = s === st(want.same_as); else if (want.above !== undefined) ok = parseFloat(s) > want.above; else if (want.below !== undefined) ok = parseFloat(s) < want.below; else if (want.has !== undefined) { const tk = s.split(/\\s+/); ok = tk.includes(want.has) && !(want.lacks || []).some(x => tk.includes(x)); } else if (want.resolves !== undefined) ok = true; else if (want.stale_min !== undefined) { const a = (Date.now() - new Date(states[id].last_updated).getTime()) / 60000; ok = a <= want.stale_min; if (!ok) t = `${label}: no data for ${Math.round(a)} min`; } } else ok = [].concat(want).includes(s); if (!ok && !t) t = `${label}: ${s}${unit && !isNaN(parseFloat(s)) ? ' ' + unit : ''}${note ? ' (' + note + ')' : ''}`; } if (ok) return {ok: true, label}; if (o.off_window && inWin(o.off_window)) return {ok: false, l: 0, t: `${label}: off as scheduled, due back ${o.off_window[1]}`, label, sched: true}; return {ok: false, l: bad(s) && o.nodata_level !== undefined ? o.nodata_level : lvl, t, label}; }; const evalAll = l1 => { const names = variables.group_names || {}; const flat = []; Object.keys(l1 || {}).forEach(k => (l1[k] || []).forEach(it => flat.push({k, it}))); { const ids = flat.map(f => f.it[0]).filter(Boolean); LOADING = ids.length > 0 && ids.filter(i => !states[i]).length * 2 > ids.length; } const raw = {}; flat.forEach(f => { if (f.it[0]) raw[f.it[0]] = {r: evalItem(f.it), it: f.it}; }); const resolve = (id, depth) => { const e = raw[id]; if (!e) return null; const p = (e.it[5] || {}).parent; if (!p || depth > 6 || e.r.ok) return e.r; const pr = resolve(p, depth + 1); if (pr && !pr.ok) return {...e.r, sup: true, by: pr.by || pr.label, bySched: pr.bySched || pr.sched}; return e.r; }; return flat.map(f => { const r = f.it[0] ? resolve(f.it[0], 0) : evalItem(f.it); return {...r, k: f.k, g: names[f.k] || f.k}; }); }; const line = (m, pre) => `<div style='font-size:13px;font-weight:${m.l ? 600 : 400};color:${COL[m.l]};margin-top:3px'>${ICON[m.l]} ${pre ? m.g + ': ' : ''}${m.t}</div>`; const supLines = (list, pre) => { const by = {}; list.forEach(m => { const key = (pre ? m.g + ': ' : '') + m.by; (by[key] = by[key] || []).push(m.label); }); return Object.keys(by).map(b => `<div style='font-size:12px;color:#808080;margin-top:3px'>○ ${by[b].length} suppressed, ${b} is out: ${by[b].join(', ')}</div>`).join(''); }; const res = evalAll(variables.l1); const act = res.filter(r => !r.ok && !r.sup && r.l > 0).sort((a, b) => b.l - a.l); const sup = res.filter(r => r.sup && !r.bySched).length; const sched = res.filter(r => !r.ok && (r.sched || r.bySched)).length; const n = l => act.filter(m => m.l === l).length; const top = act.length ? act[0].l : 0; const msg = act.length ? `<span style='font-weight:600;color:${COL[top]}'>${ICON[top]} ${act[0].g}: ${act[0].t}</span>${act.length > 1 ? `<span style='color:#666'> · +${act.length - 1} more</span>` : ''}` : `<span style='color:#666'>No active alarms</span>`; const extra = [sup ? `${sup} suppressed` : '', sched ? `${sched} off as scheduled` : ''].filter(x => x).join(' · '); const counts = [3, 2, 1].map(l => `<span style='color:${n(l) ? COL[l] : '#999'}'>${ICON[l]} ${n(l)}</span>`).join(' '); return `<div style='display:flex;align-items:center;gap:12px;height:30px;padding:0 12px;border-left:6px solid ${top ? COL[top] : '#999999'};font-size:13px;white-space:nowrap;overflow:hidden'><span style='flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis'>${msg}</span>${extra ? `<span style='color:#808080'>${extra}</span>` : ''}<span style='font-weight:600'>${counts}</span><span style='color:#666'>›</span></div>`; ]]]"
