# button-card template "isa_facts", exported from the dashboard's raw config.
isa_facts:
  show_name: false
  show_icon: false
  show_state: false
  styles:
    card:
      - padding: "0"
      - background: "#e8e8e8"
      - border: "1px solid #999999"
      - border-radius: "2px"
      - box-shadow: none
      - color: "#1a1a1a"
      - outline: "[[[ const s = states['input_select.isa_lamp_test']; const c = {critical: '#cc0000', warning: '#cc8800', advisory: '#0088cc'}[s ? s.state : 'off']; return c ? `4px solid ${c}` : 'none'; ]]]"
      - outline-offset: "-4px"
    grid:
      - grid-template-areas: "\"f\""
      - grid-template-columns: "1fr"
    custom_fields:
      f:
        - width: "100%"
        - text-align: left
        - white-space: normal
  custom_fields:
    f: "[[[ const f = variables.f; const COL = {0:'#808080',1:'#0088cc',2:'#cc8800',3:'#cc0000'}; const ICON = {1:'◇',2:'▲',3:'◆'}; const now = Date.now(); const msgs = []; const parts = []; const dur = ms => { const t = Math.max(0, Math.floor(ms / 60000)); const d = Math.floor(t / 1440), h = Math.floor(t % 1440 / 60), mi = t % 60; return d ? `${d} d ${h} h` : h ? `${h} h ${mi} min` : `${mi} min`; }; const ts = id => { const s = states[id]; const t = s ? Date.parse(s.state) : NaN; return isNaN(t) ? null : t; }; const boot = ts(f.boot); if (boot === null) msgs.push({l: 1, t: 'Uptime: no data'}); else { parts.push(`Up ${dur(now - boot)}`); if (now - boot < 3600000) msgs.push({l: 1, t: `Rebooted ${dur(now - boot)} ago`}); } const hb = states[f.hb]; const age = hb ? now - new Date(hb.last_updated).getTime() : Infinity; parts.push(hb ? `newest data ${dur(age)} old` : 'no data'); if (age / 60000 > f.stale_min) msgs.push({l: 3, t: `No data for ${hb ? dur(age) : 'ever'}`}); const cyc = states[f.cycle]; if (cyc && !isNaN(parseFloat(cyc.state))) parts.push(`agent cycle ${parseFloat(cyc.state).toFixed(0)} s`); const chk = ts(f.checked); if (chk !== null) { parts.push(`updates checked ${dur(now - chk)} ago`); if (now - chk > f.checked_max_h * 3600000) msgs.push({l: 1, t: `Update check overdue, last ${dur(now - chk)} ago`}); } const top = msgs.reduce((x, m) => Math.max(x, m.l), 0); const lines = msgs.sort((a, b) => b.l - a.l).map(m => `<div style='font-size:13px;font-weight:600;color:${COL[m.l]};margin-top:3px'>${ICON[m.l]} ${m.t}</div>`).join(''); return `<div style='padding:8px 10px;border-left:6px solid ${top ? COL[top] : '#999999'}'><div style='font-size:12px;color:#1a1a1a'>${parts.join(' · ')}</div>${lines}</div>`; ]]]"
  extra_styles: "@keyframes isaflash { 50% { opacity: 0.15; } }"
